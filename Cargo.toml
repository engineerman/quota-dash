[package]
name = "quota_dash"
version = "0.1.0"
edition = "2021"
description = "quota-dash — AI agent quota dashboard"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1.92"
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "test-util", "process", "io-util", "sync"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6.5"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Security_Credentials", "Win32_Globalization"] }
